apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service-node
  labels:
    app: chat-service-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service-node
  template:
    metadata:
      labels:
        app: chat-service-node
    spec:
      initContainers:
        - name: chat-migrate
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "npx sequelize-cli db:migrate"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: name
      containers:
        - name: chat-service-node
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}

          ports:
            - containerPort: 3007
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3007"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: host
            - name: DB_PORT 
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: name
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: chat-rabbitmq
                  key: url
            - name: CORS_ORIGIN
              value: "https://steep-geology-napping.ngrok-free.dev"
            - name: OTEL_SERVICE_NAME
              value: "chat-service-node"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 5
            periodSeconds: 10
